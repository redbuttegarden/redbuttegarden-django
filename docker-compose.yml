services:
  web:
    container_name: rbg-web
    env_file:
      - $HOME/.rbg-env.dev
    build: redbuttegarden/
    volumes:
      - ./redbuttegarden:/code
      - static_volume:/code/static
      - media_volume:/code/media
    depends_on:
      - db
      - oakley-chat
    command: sh -c "python manage.py collectstatic --noinput && python manage.py runserver 0.0.0.0:8000"

  oakley-chat:
    container_name: oakley-chat
    build:
      context: /home/dev/PycharmProjects/oakley_2
    env_file:
      - path: $HOME/.config/oakley_2/.env
        format: raw
    working_dir: /app
    volumes:
      - /home/dev/PycharmProjects/oakley_2:/app
    environment:
      - AWS_DEFAULT_REGION=us-east-1
      - HOST=0.0.0.0
      - PORT=8000
      - RED_BUTTE_DATA_API_BASE_URL=http://web:8000/oakley-chat/data
      - RELOAD=false
    command: sh -c "unset AWS_PROFILE AWS_DEFAULT_PROFILE && python -m uvicorn app:app --host 0.0.0.0 --port 8000"

  db:
    container_name: rbg-db
    image: "postgres:18.3"
    ports:
      - "5432:5432"
    env_file:
      - $HOME/.rbg-env.dev
    volumes:
      - postgres_data:/var/lib/postgresql

  nginx:
    build: ./nginx
    container_name: nginx
    restart:
      unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - web
    volumes:
      - static_volume:/home/static
      - media_volume:/home/media
      - ./nginx/templates:/etc/nginx/templates
      - $HOME/rbg-web/certs:/etc/ssl/certs
    environment:
      - NGINX_HOST=rbg-it-web-dev.redbutte.utah.edu
      - APP_PORT=8000
      - DEBUG=#debugging_on

volumes:
  postgres_data:
  static_volume:
  media_volume:
